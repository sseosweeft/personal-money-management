<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amplop Belanja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Dompet Ibu</h1>
    <p>Catat pemasukan dan pengeluaranmu dengan rapi</p>
  </header>

  <main>
    <section class="ringkasan" aria-label="Ringkasan keuangan">
      <div><span>Pemasukan</span><strong id="totalMasuk">Rp0</strong></div>
      <div><span>Pengeluaran</span><strong id="totalKeluar">Rp0</strong></div>
      <div><span>Saldo</span><strong id="saldo">Rp0</strong></div>
    </section>

    <section>
      <h2>Catat transaksi</h2>
      <form id="formTransaksi" novalidate>
        <label>Tanggal <input type="date" id="tanggal"></label>
        <label>Jenis
          <select id="jenis">
            <option value="pengeluaran">Pengeluaran</option>
            <option value="pemasukan">Pemasukan</option>
          </select>
        </label>
        <label>Kategori
          <select id="kategori">
            <option>Belanja Dapur</option>
            <option>Listrik &amp; Air</option>
            <option>Anak &amp; Sekolah</option>
            <option>Transportasi</option>
          </select>
        </label>
        <label>Nominal (Rp) <input type="number" id="nominal" placeholder="25000"></label>
        <label class="lebar">Catatan (opsional) <input type="text" id="catatan" placeholder="Sayur di pasar"></label>
        <p id="pesanError" class="error" role="alert"></p>
        <button type="submit">Simpan transaksi</button>
      </form>
    </section>

    <section>
      <h2>Riwayat</h2>
      <ul id="daftarTransaksi"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
